# Builds the mod for every supported Minecraft version and publishes the jars as one GitHub release
# whenever a tag is pushed. The tag (minus a leading "v") becomes the mod version, suffixed with the
# Minecraft version, e.g. tag v1.2.0 -> neoz_enderlink-1.2.0+26.1.jar, neoz_enderlink-1.2.0+26.2.jar, ...

name: release
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Versions for each target: check them on https://fabricmc.net/develop
        # Code specific to one target lives in src/client/versions/<label>
        include:
          - label: '26.1'
            minecraft_version: '26.1.2'
            fabric_api_version: '0.155.3+26.1.2'
          - label: '26.2'
            minecraft_version: '26.2'
            fabric_api_version: '0.161.0+26.2'
          - label: '26.3'
            minecraft_version: '26.3'
            fabric_api_version: '0.161.0+26.3'
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ./gradlew build \
            -Pversion="${TAG#v}+${{ matrix.label }}" \
            -Pminecraft_version="${{ matrix.minecraft_version }}" \
            -Pminecraft_dependency="~${{ matrix.label }}" \
            -Pfabric_api_version="${{ matrix.fabric_api_version }}"
      - name: upload jar
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.label }}
          path: build/libs/neoz_enderlink-*+${{ matrix.label }}.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download jars
        uses: actions/download-artifact@v8
        with:
          pattern: jar-*
          path: jars
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" jars/*.jar \
            --verify-tag \
            --title "Neoz's Enderlink $TAG" \
            --generate-notes
